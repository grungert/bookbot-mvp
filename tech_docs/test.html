<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero Spheres — Mouse Leader + Surround Gravity (Fixed)</title>

  <style>
    :root {
      --grid: rgba(60, 120, 255, 0.12);
      --bg1: #f7fbff;
      --bg2: #eef5ff;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    body {
      background:
        radial-gradient(900px 520px at 20% 25%, rgba(80, 140, 255, 0.18), transparent 60%),
        radial-gradient(900px 520px at 85% 10%, rgba(120, 80, 255, 0.14), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2)),
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: auto, auto, auto, 80px 80px, 80px 80px;
      background-position: center, center, center, 0 0, 0 0;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      /* keep UI clickable */
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* demo UI */
    #ui {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 56px 22px 0;
      text-align: center;
    }

    #ui h1 {
      margin: 120px 0 14px 0;
      font-size: clamp(38px, 6vw, 72px);
      line-height: 1.03;
      letter-spacing: -0.04em;
      color: #0b0f1a;
    }

    #ui p {
      margin: 0 auto 28px;
      max-width: 760px;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.45;
      color: rgba(11, 15, 26, 0.65);
    }

    .cta {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 650;
      font-size: 16px;
      cursor: pointer;
    }

    .btn.primary {
      background: #1f5eff;
      color: #fff;
      box-shadow: 0 14px 30px rgba(31, 94, 255, 0.22);
    }

    .btn.ghost {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      color: #0b0f1a;
      border: 1px solid rgba(11, 15, 26, 0.08);
    }

    .lil-gui {
      z-index: 9999 !important;
    }
  </style>

  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
</head>

<body>
  <div id="bg"></div>

  <div id="ui">
    <h1>Automatizujte Poslovanje</h1>
    <p>Pametno zakazivanje, fakturisanje i AI podrška u jednoj platformi.</p>
    <div class="cta">
      <button class="btn primary">Pocnite besplatno →</button>
      <button class="btn ghost">▶ Pogledajte demo</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";

    // -----------------------------
    // Settings (all wired)
    // -----------------------------
    const settings = {
      // population
      count: 180, // increased slightly for better cloud effect
      minSize: 0.55,
      maxSize: 1.55,

      // leader follow
      leaderSize: 7,
      leaderFollow: 0.28,      // 0..1 (bigger = more responsive)
      leaderPlaneDist: 30,     // plane distance in front of camera
      freezeLeader: false,

      // surround physics (THIS is what you want)
      gravity: 12.0,           // stronger pull
      shellRadius: 3.2,        // distance where spheres like to sit around leader
      shellStrength: 3.5,      // stronger shell enforcement
      orbit: 3.0,              // faster orbit
      separation: 0.8,         // repulsion
      maxVelocity: 3.6,        // INCREASED per user request
      friction: 0.96,
      soften: 1.2,             // prevents infinite force near leader
      collisionRestitution: 0.7, // bounciness 0-1

      // colors
      colorA: "#1f56da",
      colorB: "#86b6ff",
      leaderColor: "#2b64ff",
      glowColor: "#8b5bff",
      showGlowCore: true,

      // lighting
      ambientIntensity: 1.5,   // increased
      keyIntensity: 1.5,       // increased
      rimIntensity: 0.75,
      exposure: 1.0,

      // bloom
      bloomStrength: 0.0,      // disabled per screenshot
      bloomRadius: 0.13,
      bloomThreshold: 0.12,

      // actions
      respawn: () => spawnFollowers(),
      centerLeader: () => leaderTarget.set(0, 0, 0)
    };

    // -----------------------------
    // Scene / Camera / Renderer
    // -----------------------------
    const container = document.getElementById("bg");
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0.2, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = settings.exposure;
    container.appendChild(renderer.domElement);

    // Environment (glossy highlights)
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, settings.ambientIntensity);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffffff, settings.keyIntensity);
    key.position.set(7, 12, 10);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x9bb6ff, settings.rimIntensity);
    rim.position.set(-10, 3, 8);
    scene.add(rim);

    // -----------------------------
    // Bloom pipeline
    // -----------------------------
    const renderScene = new RenderPass(scene, camera);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      settings.bloomStrength,
      settings.bloomRadius,
      settings.bloomThreshold
    );

    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(renderScene);
    bloomComposer.addPass(bloomPass);

    const finalPass = new ShaderPass(
      new THREE.ShaderMaterial({
        uniforms: {
          baseTexture: { value: null },
          bloomTexture: { value: bloomComposer.renderTarget2.texture },
        },
        vertexShader: /* glsl */ `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
        fragmentShader: /* glsl */ `
            uniform sampler2D baseTexture;
            uniform sampler2D bloomTexture;
            varying vec2 vUv;
            void main() {
              vec4 base = texture2D(baseTexture, vUv);
              vec4 bloom = texture2D(bloomTexture, vUv);
              gl_FragColor = base + bloom;
            }
          `,
      }),
      "baseTexture"
    );
    finalPass.needsSwap = true;

    const finalComposer = new EffectComposer(renderer);
    finalComposer.addPass(renderScene);
    finalComposer.addPass(finalPass);

    // -----------------------------
    // Materials
    // -----------------------------
    function makeSphereMaterial(hex) {
      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(hex),
        roughness: 0.18,
        metalness: 0.12,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
      });
    }

    // -----------------------------
    // Objects
    // -----------------------------
    const sphereGeo = new THREE.SphereGeometry(0.55, 40, 28);

    const leader = new THREE.Mesh(sphereGeo, makeSphereMaterial(settings.leaderColor));
    leader.scale.setScalar(settings.leaderSize);
    leader.position.set(0, 0, 0);
    scene.add(leader);

    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(3.6, 48, 32),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color(settings.glowColor),
        emissive: new THREE.Color(settings.glowColor),
        emissiveIntensity: 1.35,
        roughness: 0.85,
        metalness: 0.0,
        transparent: true,
        opacity: 0.70,
      })
    );
    glow.position.set(0, 0, 0); // start centered
    scene.add(glow);

    // Followers
    let followers = [];
    const tmp1 = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const tmp3 = new THREE.Vector3();

    function clearFollowers() {
      for (const f of followers) scene.remove(f.mesh);
      followers = [];
    }

    function spawnFollowers() {
      clearFollowers();

      const colA = new THREE.Color(settings.colorA);
      const colB = new THREE.Color(settings.colorB);

      for (let i = 0; i < settings.count; i++) {
        const s = THREE.MathUtils.lerp(settings.minSize, settings.maxSize, Math.random());
        const m = new THREE.Mesh(sphereGeo, makeSphereMaterial("#ffffff"));
        m.material.color.copy(new THREE.Color().lerpColors(colA, colB, Math.random()));
        m.scale.setScalar(s);

        // spawn around the screen volume
        const angle = Math.random() * Math.PI * 2;
        const r = THREE.MathUtils.randFloat(10, 22);
        const y = THREE.MathUtils.randFloat(-12, 12);
        const z = THREE.MathUtils.randFloat(-14, 8);
        m.position.set(Math.cos(angle) * r, y, z);

        const v = new THREE.Vector3(
          THREE.MathUtils.randFloatSpread(0.15),
          THREE.MathUtils.randFloatSpread(0.15),
          THREE.MathUtils.randFloatSpread(0.10)
        );

        // random axis for this particle to orbit around
        const axis = new THREE.Vector3(
          Math.random() - 0.5,
          Math.random() - 0.5,
          Math.random() - 0.5
        ).normalize();

        scene.add(m);
        followers.push({ mesh: m, vel: v, axis: axis });
      }
    }

    spawnFollowers();

    // -----------------------------
    // Leader follow (FIXED): raycast to a plane in front of camera
    // -----------------------------
    const pointerNDC = new THREE.Vector2(0, 0);
    const raycaster = new THREE.Raycaster();
    const leaderTarget = new THREE.Vector3(0, 0, 0);

    const planeNormal = new THREE.Vector3();
    const planePoint = new THREE.Vector3();
    const followPlane = new THREE.Plane();

    function updateFollowPlane() {
      camera.getWorldDirection(planeNormal); // forward
      planePoint.copy(camera.position).addScaledVector(planeNormal, settings.leaderPlaneDist);
      followPlane.setFromNormalAndCoplanarPoint(planeNormal, planePoint);
    }

    updateFollowPlane();

    window.addEventListener(
      "pointermove",
      (e) => {
        if (settings.freezeLeader) return;

        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointerNDC, camera);
        // intersect ray with plane
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(followPlane, hit)) {
          leaderTarget.copy(hit);
        }
      },
      { passive: true }
    );

    // -----------------------------
    // Surround physics (STRONG + visible)
    // -----------------------------
    function stepFollowers(dt) {
      const L = leader.position;
      const shellR = settings.shellRadius;

      // 1) attraction + shell + orbit
      for (let i = 0; i < followers.length; i++) {
        const fi = followers[i];
        const p = fi.mesh.position;

        // dir to leader
        tmp1.copy(L).sub(p);
        const dist = tmp1.length() + 1e-6;
        const dir = tmp1.multiplyScalar(1 / dist);

        // A) gravity-ish pull (strong, stable)
        // force ~ gravity / (dist + soften)
        const pull = settings.gravity / (dist + settings.soften);
        tmp2.copy(dir).multiplyScalar(pull);

        // B) shell: keep them around leader at shellRadius
        // error >0 => too far -> pull in ; error <0 => too close -> push out
        const shellError = dist - shellR;
        tmp2.addScaledVector(dir, shellError * settings.shellStrength);

        // C) orbit: tangential force around random axis
        // tangent = dir x axis (perp direction)
        const tangent = tmp3.copy(dir).cross(fi.axis);
        tmp2.addScaledVector(tangent, settings.orbit);

        // D) Leader collision with bounce
        const radiusLeader = 0.55 * settings.leaderSize;
        const radiusFollower = 0.55 * fi.mesh.scale.x;
        const minDistLeader = radiusLeader + radiusFollower;

        if (dist < minDistLeader) {
          const overlap = minDistLeader - dist;

          // Push follower out
          p.addScaledVector(dir, -overlap);

          // Bounce velocity
          const velTowardLeader = fi.vel.dot(dir);
          if (velTowardLeader > 0) {
            const restitution = 0.6;
            fi.vel.addScaledVector(dir, -(1 + restitution) * velTowardLeader);
          }
        }

        // integrate
        fi.vel.addScaledVector(tmp2, dt);

        // clamp velocity
        const vlen = fi.vel.length();
        if (vlen > settings.maxVelocity) fi.vel.multiplyScalar(settings.maxVelocity / vlen);

        // friction
        fi.vel.multiplyScalar(Math.pow(settings.friction, dt * 60));

        // position update
        p.addScaledVector(fi.vel, dt);

        // subtle rotation for highlights
        fi.mesh.rotation.y += dt * 0.25;
        fi.mesh.rotation.x += dt * 0.16;
      }

      // 2) Sphere-to-sphere collision with bounce
      for (let i = 0; i < followers.length; i++) {
        for (let j = i + 1; j < followers.length; j++) {
          const a = followers[i];
          const b = followers[j];

          // Get actual radii (base sphere is 0.55, scaled by mesh scale)
          const radiusA = 0.55 * a.mesh.scale.x;
          const radiusB = 0.55 * b.mesh.scale.x;
          const minDist = radiusA + radiusB;

          // Vector from b to a
          tmp1.copy(a.mesh.position).sub(b.mesh.position);
          const dist = tmp1.length();

          // Collision detected
          if (dist < minDist && dist > 0.0001) {
            const overlap = minDist - dist;
            const normal = tmp1.normalize();

            // 1. Separate spheres (position correction)
            const correction = overlap * 0.5;
            a.mesh.position.addScaledVector(normal, correction);
            b.mesh.position.addScaledVector(normal, -correction);

            // 2. Bounce velocities (elastic collision)
            const relVel = tmp2.copy(a.vel).sub(b.vel);
            const velAlongNormal = relVel.dot(normal);

            // Only resolve if moving toward each other
            if (velAlongNormal < 0) {
              const restitution = settings.collisionRestitution;
              const impulse = -(1 + restitution) * velAlongNormal * 0.5;

              a.vel.addScaledVector(normal, impulse);
              b.vel.addScaledVector(normal, -impulse);
            }
          }
        }
      }
    }

    // -----------------------------
    // Animate
    // -----------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      const t = clock.elapsedTime;

      updateFollowPlane();

      // leader moves to target
      if (!settings.freezeLeader) {
        // smoothing that actually works at any fps
        const a = 1.0 - Math.pow(1.0 - settings.leaderFollow, dt * 60);
        leader.position.lerp(leaderTarget, a);
      }

      leader.scale.setScalar(settings.leaderSize);

      glow.visible = settings.showGlowCore;
      if (glow.visible) {
        // ALIGNED: perfectly follow leader, no offset
        glow.position.copy(leader.position);
        glow.scale.setScalar(1.0 + Math.sin(t * 1.6) * 0.02);
        glow.material.opacity = 0.68 + Math.sin(t * 1.2) * 0.03;
      }

      stepFollowers(dt);

      // small camera parallax
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, leader.position.x * 0.02, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.2 + leader.position.y * 0.02, 0.04);
      camera.lookAt(0, 0, 0);

      bloomComposer.render();
      finalComposer.render();
    }

    animate();

    // -----------------------------
    // Resize
    // -----------------------------
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      bloomComposer.setSize(window.innerWidth, window.innerHeight);
      finalComposer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", onResize);

    // -----------------------------
    // GUI (all wired)
    // -----------------------------
    const gui = new GUI({ title: "Hero Controls" });

    const fPop = gui.addFolder("Population");
    fPop.add(settings, "count", 5, 180, 1).onFinishChange(settings.respawn);
    fPop.add(settings, "minSize", 0.1, 1.2, 0.01).onFinishChange(settings.respawn);
    fPop.add(settings, "maxSize", 0.2, 3.0, 0.01).onFinishChange(settings.respawn);
    fPop.add(settings, "respawn").name("Respawn spheres");

    const fLeader = gui.addFolder("Leader");
    fLeader.add(settings, "leaderSize", 0.8, 8.0, 0.01);
    fLeader.add(settings, "leaderFollow", 0.02, 0.7, 0.01);
    fLeader.add(settings, "leaderPlaneDist", 6, 40, 0.1);
    fLeader.add(settings, "freezeLeader");
    fLeader.add(settings, "centerLeader").name("Center leader");

    const fMotion = gui.addFolder("Surround Physics");
    fMotion.add(settings, "gravity", 0.1, 25, 0.1);
    fMotion.add(settings, "shellRadius", 0.5, 12, 0.01);
    fMotion.add(settings, "shellStrength", 0.1, 8, 0.01);
    fMotion.add(settings, "orbit", 0.0, 8, 0.01).name("Orbit Speed");
    fMotion.add(settings, "separation", 0.0, 4, 0.01);
    fMotion.add(settings, "maxVelocity", 0.1, 5, 0.01).name("Max Speed");
    fMotion.add(settings, "friction", 0.90, 0.999, 0.001);
    fMotion.add(settings, "soften", 0.1, 6.0, 0.01);
    fMotion.add(settings, "collisionRestitution", 0, 1, 0.01).name("Bounciness");

    const fColor = gui.addFolder("Colors");
    fColor.addColor(settings, "colorA").onChange(settings.respawn);
    fColor.addColor(settings, "colorB").onChange(settings.respawn);
    fColor.addColor(settings, "leaderColor").onChange(() => leader.material.color.set(settings.leaderColor));
    fColor.addColor(settings, "glowColor").onChange(() => {
      glow.material.color.set(settings.glowColor);
      glow.material.emissive.set(settings.glowColor);
    });
    fColor.add(settings, "showGlowCore");

    const fLight = gui.addFolder("Lighting");
    fLight.add(settings, "ambientIntensity", 0, 3, 0.01).onChange(() => ambient.intensity = settings.ambientIntensity);
    fLight.add(settings, "keyIntensity", 0, 5, 0.01).onChange(() => key.intensity = settings.keyIntensity);
    fLight.add(settings, "rimIntensity", 0, 5, 0.01).onChange(() => rim.intensity = settings.rimIntensity);
    fLight.add(settings, "exposure", 0.2, 2.5, 0.01).onChange(() => renderer.toneMappingExposure = settings.exposure);

    const fBloom = gui.addFolder("Bloom");
    fBloom.add(settings, "bloomStrength", 0, 3, 0.01).onChange(() => bloomPass.strength = settings.bloomStrength);
    fBloom.add(settings, "bloomRadius", 0, 1.0, 0.01).onChange(() => bloomPass.radius = settings.bloomRadius);
    fBloom.add(settings, "bloomThreshold", 0, 1.0, 0.01).onChange(() => bloomPass.threshold = settings.bloomThreshold);

    fLeader.open();
    fMotion.open();
    fBloom.open();
  </script>
</body>

</html>
